<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img">
<title>Review timing narrows the rating gap</title>
<rect width="900" height="400" fill="white"/>
<g font-family="Arial,sans-serif" fill="#132b40">
<text x="28" y="42" font-size="26" font-weight="bold">Review timing narrows the rating gap</text>
<text x="28" y="70" font-size="16">Low ratings (1–2) as a share of rated orders</text>
<text x="28" y="120" font-size="16">Primary · Late</text>
<rect x="275" y="101" width="369.24" height="25" rx="3" fill="#235477"/>
<text x="656.24" y="119" font-size="16">61.54% (1,466/2,382)</text>
<text x="28" y="166" font-size="16">Primary · On time</text>
<rect x="275" y="147" width="55.20" height="25" rx="3" fill="#34798c"/>
<text x="342.20" y="165" font-size="16">9.20% (3,745/40,697)</text>
<text x="28" y="212" font-size="16">On/after delivery date · Late</text>
<rect x="275" y="193" width="153.96" height="25" rx="3" fill="#235477"/>
<text x="440.96" y="211" font-size="16">25.66% (156/608)</text>
<text x="28" y="258" font-size="16">On/after delivery date · On time</text>
<rect x="275" y="239" width="55.08" height="25" rx="3" fill="#34798c"/>
<text x="342.08" y="257" font-size="16">9.18% (3,725/40,563)</text>
<text x="28" y="370" font-size="15">Source: Olist delivery cohort, SQL 06. Denominators show rated orders in each group.</text>
</g></svg>